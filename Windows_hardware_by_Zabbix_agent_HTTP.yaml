zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: cddbedb8f99246a39c3e4f68bc14f74c
      template: 'Windows hardware by Zabbix agent HTTP'
      name: 'Windows hardware by Zabbix agent HTTP'
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: cc771ecfaaaa476bb580758a2c61c2d1
          name: 'CPU Temp Value'
          type: DEPENDENT
          key: lhm.cpu.core1.temp
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: °C
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..Children[?(@.Type=="Temperature" && @.Text=="CPU Core #1")].Value'
            - type: REGEX
              parameters:
                - '([0-9]+,[0-9]+).*'
                - \1
            - type: STR_REPLACE
              parameters:
                - ','
                - .
          master_item:
            key: lhm.json
          triggers:
            - uuid: 67e3b023dce44cfe9e971842e0a24bcb
              expression: 'last(/Windows hardware by Zabbix agent HTTP/lhm.cpu.core1.temp)>85'
              name: 'CPU Temperature'
              priority: WARNING
        - uuid: 6dc05bfe12d54f1080de42132d672573
          name: 'Disk Temp Value'
          type: DEPENDENT
          key: lhm.disk.temp
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: °C
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..Children[?(@.Type=="Temperature" && @.SensorId=="/hdd/0/temperature/0")].Value'
            - type: REGEX
              parameters:
                - '([0-9]+,[0-9]+).*'
                - \1
            - type: STR_REPLACE
              parameters:
                - ','
                - .
          master_item:
            key: lhm.json
          triggers:
            - uuid: d966aac081444b08a8f7ec86e54c558a
              expression: 'last(/Windows hardware by Zabbix agent HTTP/lhm.disk.temp)>45'
              name: 'Disk Temperature'
              priority: HIGH
        - uuid: 22217e660c0a409cb7eacd9f62f534e7
          name: 'Fan #1 RPM Value'
          type: DEPENDENT
          key: lhm.fan1.rpm
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: RPM
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..Children[?(@.Type=="Fan" && @.Text=="Fan #1")].Value'
            - type: REGEX
              parameters:
                - '([0-9]+).*'
                - \1
          master_item:
            key: lhm.json
          triggers:
            - uuid: 6546a0b2a6e44e708c082685531bb6f2
              expression: 'last(/Windows hardware by Zabbix agent HTTP/lhm.fan1.rpm)=0'
              name: 'Fan #1 RPM'
              priority: HIGH
        - uuid: 1fcf056ae9fb48a6bd0780f135140d8f
          name: 'Fan #2 RPM Value'
          type: DEPENDENT
          key: lhm.fan2.rpm
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: RPM
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..Children[?(@.Type=="Fan" && @.Text=="Fan #2")].Value'
            - type: REGEX
              parameters:
                - '([0-9]+).*'
                - \1
          master_item:
            key: lhm.json
          triggers:
            - uuid: 566ba00e00b24d6eb9c62737d1f53f56
              expression: 'last(/Windows hardware by Zabbix agent HTTP/lhm.fan2.rpm)=0'
              name: 'Fan #2 RPM'
              priority: HIGH
        - uuid: 6dc05bfe12d54f1080de42132d672574
          name: 'LibreHardwareMonitor JSON'
          type: HTTP_AGENT
          key: lhm.json
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: 5s
          url: 'http://{HOST.CONN}:8085/data.json'
        - uuid: ede1cb08f8714a80a4b2b9aa7561f769
          name: 'Motherboard Temperature'
          type: DEPENDENT
          key: lhm.mb.temp
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: °C
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..Children[?(@.Type=="Temperature" && @.Text=="Temperature #1")].Value'
            - type: REGEX
              parameters:
                - '([0-9]+,[0-9]+).*'
                - \1
            - type: STR_REPLACE
              parameters:
                - ','
                - .
          master_item:
            key: lhm.json
          triggers:
            - uuid: a9f154a47c554fe4a015b13cb3f4fcbc
              expression: 'last(/Windows hardware by Zabbix agent HTTP/lhm.mb.temp)>65'
              name: 'MB Temperature'
              priority: WARNING
